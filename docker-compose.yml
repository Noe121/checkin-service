version: '3.8'

services:
  checkin-service:
    build: .
    ports:
      - "8006:8006"
    environment:
      - DB_HOST=checkin-mysql
      - DB_PORT=3306
      - DB_NAME=checkin_db
      - DB_USER=checkin_user
      - DB_PASSWORD=checkin_pass
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - FEATURE_FLAG_URL=http://feature-flag-service:8083
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - checkin-network

  mysql:
    image: mysql:8.4
    container_name: checkin-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=checkin_db
      - MYSQL_USER=checkin_user
      - MYSQL_PASSWORD=checkin_pass
    ports:
      - "3307:3306"
    volumes:
      - checkin_mysql_data:/var/lib/mysql
      - ./migrations/0001_init_checkin_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - checkin-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  checkin_mysql_data:

networks:
  checkin-network:
    driver: bridge
