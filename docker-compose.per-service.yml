version: '3.8'

services:
  checkin-db:
    image: mysql:8.4
    container_name: checkin-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: checkin_db
      MYSQL_USER: checkin_user
      MYSQL_PASSWORD: checkin_pass
    ports:
      - "3307:3306"
    volumes:
      - checkin_db_data:/var/lib/mysql
      - ./migrations/0001_init_checkin_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - checkin-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  checkin-service:
    build: .
    container_name: checkin-service
    restart: unless-stopped
    depends_on:
      checkin-db:
        condition: service_healthy
    environment:
      DB_HOST: checkin-db
      DB_PORT: 3306
      DB_NAME: checkin_db
      DB_USER: checkin_user
      DB_PASSWORD: checkin_pass
      FEATURE_FLAG_URL: http://feature-flag-service:8083
      API_MODE: per-service
      SCHEMA_MODE: per-service
    ports:
      - "8006:8006"
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - checkin-network
    command: bash -c "uvicorn main:app --host 0.0.0.0 --port 8006 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  checkin_db_data:

networks:
  checkin-network:
    driver: bridge
