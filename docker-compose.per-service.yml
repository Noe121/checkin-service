services:
  # Admin Dashboard Database
  admin-db:
    image: mysql:8.0
    container_name: admin-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: admin_db
      MYSQL_USER: adminuser
      MYSQL_PASSWORD: adminpass
    ports:
      - "3322:3306"
    volumes:
      - admin_db_data:/var/lib/mysql
      - ./migrations/001_initial_schema_enhanced.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - admin-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Admin Dashboard Service
  admin-dashboard-service:
    build: .
    container_name: admin-dashboard-service
    restart: unless-stopped
    depends_on:
      admin-db:
        condition: service_healthy
    environment:
      DB_HOST: admin-db
      DB_PORT: 3306
      DB_NAME: admin_db
      DB_USER: adminuser
      DB_PASSWORD: adminpass
      AUTH_SERVICE_URL: http://host.docker.internal:9000
      API_MODE: per-service
      SCHEMA_MODE: per-service
    ports:
      - "8006:8006"
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - admin-network
    command: bash -c "uvicorn main:app --host 0.0.0.0 --port 8006 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  admin_db_data:

networks:
  admin-network:
    driver: bridge
